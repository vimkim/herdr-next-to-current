[project]
name = "herdr-next-to-current"
version = "0.1.0.dev0"
description = "Open Herdr tabs and workspaces beside the current item"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-next-to-current = "herdr_next_to_current.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
